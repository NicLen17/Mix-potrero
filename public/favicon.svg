<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1b4d2e"/>
      <stop offset="100%" stop-color="#0a1d11"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe600"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="shield" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14532d"/>
      <stop offset="100%" stop-color="#052e16"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Circle / Shield -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  
  <!-- Outer Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#gold)" stroke-width="12" stroke-dasharray="16 8"/>

  <!-- Football / Shield Icon -->
  <g transform="translate(256,230)">
    <!-- Ball circle -->
    <circle cx="0" cy="0" r="120" fill="#f8fafc" stroke="#0f172a" stroke-width="8"/>
    
    <!-- Pentagons / Football Pattern -->
    <!-- Center pentagon -->
    <polygon points="0,-40 38,-12 24,32 -24,32 -38,-12" fill="#0f172a"/>
    
    <!-- Outer pentagon arms & lines -->
    <!-- Top -->
    <polygon points="0,-40 0,-90 -45,-105 -38,-65" fill="#0f172a"/>
    <polygon points="0,-40 0,-90 45,-105 38,-65" fill="#0f172a"/>
    <!-- Top Right -->
    <polygon points="38,-12 85,-28 115,-5 75,20" fill="#0f172a"/>
    <!-- Bottom Right -->
    <polygon points="24,32 55,75 35,115 -10,85" fill="#0f172a"/>
    <!-- Bottom Left -->
    <polygon points="-24,32 -55,75 -35,115 10,85" fill="#0f172a"/>
    <!-- Top Left -->
    <polygon points="-38,-12 -85,-28 -115,-5 -75,20" fill="#0f172a"/>
  </g>

  <!-- Banner at Bottom -->
  <path d="M 96 390 L 416 390 L 380 445 L 132 445 Z" fill="url(#gold)" filter="url(#glow)"/>
  <text x="256" y="430" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" fill="#0a1d11" text-anchor="middle" letter-spacing="3">MIX POTRERO</text>
</svg>
